[project]
name = "german-grammar-trainer"
version = "0.1.0"
description = "Interleaved German Grammar Trainer (A1-B2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "fsrs>=3.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "spacy>=3.7.4",
    # German morphological tagging model for src/taxonomy/tagger.py. Pinned to
    # an exact wheel build (rather than a spaCy-style `de_core_news_sm==...`
    # extra, which relies on pip's now-deprecated direct-URL "egg" hack) so a
    # fresh `uv sync` fetches it with no manual `spacy download` step.
    "de-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl",
    "rich>=13.7.1",
    "typer>=0.12.3",
    "pypdf>=6.16.0",
    # Windows ships no system tz database; ZoneInfo needs this for the
    # Pacific-midnight Gemini RPD quota reset (docs/01-foundation.md stage 0).
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.4.4",
    "types-pyyaml>=6.0.12.20240311",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
# de-core-news-sm below is a direct URL reference (the spacy-models GitHub
# release wheel), which hatchling refuses to build against unless this is set.
allow-direct-references = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "simulation: synthetic-learner scheduler runs (slow, deterministic seed)",
    "live: real API or real network (nightly only)",
    "golden: compares against a versioned fixture",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
