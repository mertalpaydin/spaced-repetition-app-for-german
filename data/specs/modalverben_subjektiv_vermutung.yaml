topic_id: modalverben_subjektiv_vermutung
cefr: B2
target_form: 'Epistemic use of modal verbs expressing varying degrees of probability/certainty:
  muss (100%), dürfte (75%), kann/könnte (50%).'
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Er ___ seit 10 Stunden, er muss sehr müde sein. (99% sicher)
  accepted_answers:
  - arbeitet
  difficulty: 1
  cue: null
- prompt: Das ___ dürfte morgen ankommen. (wahrscheinlich)
  accepted_answers:
  - Paket
  difficulty: 1
  cue: null
- prompt: Hier steht Beispielsatz Nummer 3 mit ___ Lücke.
  accepted_answers:
  - einer
  difficulty: 1
  cue: null
