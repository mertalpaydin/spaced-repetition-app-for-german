topic_id: verben_reflexiv_akk
cefr: A2
target_form: Reflexive verbs governing Accusative reflexive pronouns (mich, dich,
  sich, uns, euch, sich).
item_types:
- cloze_free
- cloze_cued
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: A2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich freue ___ auf die Ferien.
  accepted_answers:
  - mich
  difficulty: 1
  cue: null
- prompt: Weil der Bus gleich kommt, beeilen wir ___ sehr.
  accepted_answers:
  - uns
  difficulty: 2
  cue: null
- prompt: Obwohl die Party schon begonnen hatte, zog mein Bruder ___ in aller Ruhe an.
  accepted_answers:
  - sich
  difficulty: 3
  cue: null
