topic_id: adjektivdeklination_bestimmt
cefr: A2
target_form: 'Weak adjective endings after definite articles: only -e (Nom Sg, Acc
  Fem/Neut) and -en everywhere else.'
item_types:
- cloze_free
- cloze_cued
max_tokens_per_sentence: 18
vocabulary_ceiling: A2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Der ___ Mann liest die Zeitung.
  accepted_answers:
  - alte
  difficulty: 1
  cue: null
- prompt: Weil er Hunger hatte, aß er die ___ Suppe sofort auf.
  accepted_answers:
  - heiße
  difficulty: 2
  cue: null
- prompt: Obwohl der Wind stark blies, dankte die Crew dem ___ Kapitän für seine Ruhe.
  accepted_answers:
  - erfahrenen
  difficulty: 3
  cue: null
