topic_id: relativsatz_nom_akk
cefr: B1
target_form: Relative clauses in Nominative and Accusative cases; pronoun matches
  antecedent in gender/number and clause function in case.
item_types:
- cloze_free
- transformation
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich kenne den Mann, ___ dort drüben wohnt.
  accepted_answers:
  - der
  difficulty: 1
  cue: null
- prompt: Der Kollege, ___ ich täglich im Aufzug treffe, arbeitet im dritten
    Stock.
  accepted_answers:
  - den
  difficulty: 2
  cue: null
- prompt: Diese Bücher, ___ er mir vor Jahren empfohlen hat, stehen noch in
    meinem Regal.
  accepted_answers:
  - die
  difficulty: 3
  cue: null
