topic_id: relativsatz_was_wo
cefr: B2
target_form: Relative clauses with generalized relative pronouns ('was' after alles/nichts/etwas/Superlativ;
  'wo/wohin' after place names).
item_types:
- cloze_free
- transformation
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Das ist alles, ___ ich dazu sagen kann.
  accepted_answers:
  - was
  difficulty: 1
  cue: null
- prompt: Wir waren in München, ___ das Oktoberfest stattfindet.
  accepted_answers:
  - wo
  difficulty: 2
  cue: null
- prompt: Nichts, ___ die Kommission bisher vorgeschlagen hat, konnte die Kritiker
    überzeugen.
  accepted_answers:
  - was
  difficulty: 3
  cue: null
