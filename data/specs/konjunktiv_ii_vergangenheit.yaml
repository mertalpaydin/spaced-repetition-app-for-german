topic_id: konjunktiv_ii_vergangenheit
cefr: B1
target_form: 'Unreal conditions in the past: wäre/hätte + Partizip II expressing what
  could have happened but did not.'
item_types:
- cloze_free
- cloze_cued
- transformation
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Wenn du mich rechtzeitig angerufen ___, hätte ich dir geholfen.
  accepted_answers:
  - hättest
  difficulty: 1
  cue: null
- prompt: Fast ___ ich zu spät zum Flughafen gekommen, weil die Straßen an
    diesem Morgen völlig verstopft waren.
  accepted_answers:
  - wäre
  difficulty: 2
  cue: null
- prompt: Wenn die Verhandlungen früher zu einem Ergebnis gekommen ___,
    hätten die beiden Länder den Konflikt vermutlich friedlich beigelegt,
    obwohl die politischen Spannungen ohnehin schon lange bestanden.
  accepted_answers:
  - wären
  difficulty: 3
  cue: null
