topic_id: praeteritum_sein_haben_modal
cefr: A2
target_form: Simple past of auxiliary verbs (war, hatte) and modal verbs (konnte,
  musste, wollte, durfte, sollte).
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: A2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Früher ___ ich große Angst vor Hunden.
  accepted_answers:
  - hatte
  difficulty: 1
  cue: null
- prompt: Weil es so kalt war, ___ wir dicke Jacken anziehen.
  accepted_answers:
  - mussten
  difficulty: 2
  cue: null
- prompt: Obwohl du krank warst, ___ du unbedingt zur Prüfung kommen.
  accepted_answers:
  - wolltest
  difficulty: 3
  cue: null
