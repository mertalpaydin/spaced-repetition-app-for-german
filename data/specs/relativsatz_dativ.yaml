topic_id: relativsatz_dativ
cefr: B1
target_form: Relative clauses with Dative relative pronouns (dem, der, dem, denen).
item_types:
- cloze_free
- transformation
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Das ist der Kollege, ___ ich gestern geholfen habe.
  accepted_answers:
  - dem
  difficulty: 1
  cue: null
- prompt: Die Chefin, ___ ich meine Kündigung schicken musste, hat schnell
    reagiert.
  accepted_answers:
  - der
  difficulty: 2
  cue: null
- prompt: Das Kind, ___ die Erzieherin geduldig zugehört hat, wirkte
    anschließend deutlich ruhiger.
  accepted_answers:
  - dem
  difficulty: 3
  cue: null
