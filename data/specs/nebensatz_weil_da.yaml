  - bin
  difficulty: 1
  cue: null
- prompt: Da es draußen kalt ___, ziehe ich eine Jacke an.
  accepted_answers:
  - ist
  difficulty: 2
  cue: null
- prompt: Weil der Zug, der aus München kommt, Verspätung ___, warten die Fahrgäste
    nervös.
  accepted_answers:
  - hat
  difficulty: 3
  cue: null
