topic_id: relativsatz_genitiv
cefr: B1
target_form: Genitive relative clauses expressing possession (dessen for m/n, deren
  for f/pl) without article on following noun.
item_types:
- cloze_free
- transformation
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Der Autor, ___ Buch ich gerade lese, ist berühmt.
  accepted_answers:
  - dessen
  difficulty: 1
  cue: null
- prompt: Die Firma, ___ Produkte weltweit bekannt sind, sucht neue
    Mitarbeiter.
  accepted_answers:
  - deren
  difficulty: 2
  cue: null
- prompt: Die Wissenschaftler, ___ Studie großes Aufsehen erregt hatte,
    wurden zu einem internationalen Kongress eingeladen.
  accepted_answers:
  - deren
  difficulty: 3
  cue: null
