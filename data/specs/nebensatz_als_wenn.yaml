topic_id: nebensatz_als_wenn
cefr: B1
target_form: 'Temporal contrast: ''als'' for one-time past event vs ''wenn'' for repeated
  past events or present/future conditions.'
item_types:
- cloze_free
- cloze_cued
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: ___ ich letzten Sommer in Italien war, habe ich viel Eis gegessen.
  accepted_answers:
  - Als
  difficulty: 1
  cue: null
- prompt: ___ ich als Kind Fieber hatte, blieb ich immer zu Hause.
  accepted_answers:
  - Wenn
  difficulty: 2
  cue: null
- prompt: ___ die Verhandlungen, die Monate gedauert hatten, endlich abgeschlossen
    wurden, atmeten alle Beteiligten auf.
  accepted_answers:
  - Als
  difficulty: 3
  cue: null
