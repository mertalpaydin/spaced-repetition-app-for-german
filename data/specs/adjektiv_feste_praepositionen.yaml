topic_id: adjektiv_feste_praepositionen
cefr: B2
target_form: Adjectives that take fixed prepositions with specific cases (stolz auf
  + Akk, zufrieden mit + Dat, bereit zu + Dat, fähig zu + Dat).
item_types:
- cloze_free
- cloze_cued
- error_correction
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Die Eltern sind sehr stolz ___ ihre Tochter.
  accepted_answers:
  - auf
  difficulty: 1
  cue: null
- prompt: Nach dem Gespräch war sie sehr zufrieden ___ dem Ergebnis.
  accepted_answers:
  - mit
  difficulty: 2
  cue: null
- prompt: Der Sportler, der jahrelang hart trainiert hat, ist zu solchen Höchstleistungen
    ___.
  accepted_answers:
  - fähig
  difficulty: 3
  cue: null
