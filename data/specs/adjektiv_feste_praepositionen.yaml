  difficulty: 1
  cue: null
- prompt: Bist ___ mit dem Angebot zufrieden?
  accepted_answers:
  - du
  difficulty: 1
  cue: null
- prompt: Hier steht Beispielsatz Nummer 3 mit ___ Lücke.
  accepted_answers:
