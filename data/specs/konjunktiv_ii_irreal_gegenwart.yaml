topic_id: konjunktiv_ii_irreal_gegenwart
cefr: B1
target_form: 'Unreal conditional clauses and wishes in the present: wenn + Konjunktiv
  II (wäre, hätte, würde + Infinitiv).'
item_types:
- cloze_free
- cloze_cued
- transformation
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Wenn ich mehr Zeit ___, würde ich mehr Sport treiben.
  accepted_answers:
  - hätte
  difficulty: 1
  cue: null
- prompt: Wenn ihr mehr Geduld ___, würde alles einfacher laufen.
  accepted_answers:
  - hättet
  difficulty: 2
  cue: null
- prompt: Wenn die Firmen enger zusammenarbeiten ___, könnten viele Probleme
    schneller gelöst werden, obwohl die Branche traditionell sehr
    konkurrenzorientiert ist.
  accepted_answers:
  - würden
  difficulty: 3
  cue: null
