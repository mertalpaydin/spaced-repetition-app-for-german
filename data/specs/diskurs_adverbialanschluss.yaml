topic_id: diskurs_adverbialanschluss
cefr: B2
target_form: 'Connective discourse adverbs linking paragraphs and arguments: allerdings,
  dennoch, folglich, insofern, demnach.'
item_types:
- paragraph_cloze
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Die neue Software soll die Arbeit erleichtern. ___ müssen die Mitarbeiter
    zunächst geschult werden.
  accepted_answers:
  - Allerdings
  difficulty: 1
  cue: null
- prompt: Die Testergebnisse waren eindeutig positiv. ___ wurde das Medikament für
    den Markt zugelassen.
  accepted_answers:
  - Folglich
  - Demnach
  difficulty: 2
  cue: null
- prompt: Die Kritiker bemängeln seit Jahren die mangelnde Transparenz der Behörde,
    die viele wichtige Entscheidungen unter Ausschluss der Öffentlichkeit trifft.
    ___ bleibt das Vertrauen der Bürger in die Institution gering.
  accepted_answers:
  - Demnach
  - Folglich
  difficulty: 3
  cue: null
