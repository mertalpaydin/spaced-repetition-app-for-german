topic_id: praepositionen_genitiv_gehoben
cefr: B2
target_form: Complex and formal Genitive prepositions in academic/formal registers
  (anhand, anlässlich, infolge, zugunsten, bezüglich, mittels).
item_types:
- cloze_free
- cloze_cued
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Anhand ___ Studie lässt sich das Problem besser einordnen.
  accepted_answers:
  - der
  difficulty: 1
  cue: null
- prompt: Infolge ___ Sturms war die Autobahn stundenlang gesperrt.
  accepted_answers:
  - des
  difficulty: 2
  cue: null
- prompt: Bezüglich ___ Anfrage möchten wir kurz Stellung nehmen, bevor
    die Frist morgen abläuft.
  accepted_answers:
  - einer
  difficulty: 3
  cue: null
