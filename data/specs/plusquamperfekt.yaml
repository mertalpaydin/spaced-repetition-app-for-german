topic_id: plusquamperfekt
cefr: B1
target_form: 'Past perfect tense expressing anteriority: hatte/war (Präteritum) +
  Partizip II at sentence end.'
item_types:
- cloze_free
- cloze_cued
- paragraph_cloze
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Nachdem er gefrühstückt ___, ging er zur Arbeit.
  accepted_answers:
  - hatte
  difficulty: 1
  cue: null
- prompt: Das Telefon klingelte spät in der Nacht. Du ___ da schon längst
    eingeschlafen.
  accepted_answers:
  - warst
  difficulty: 2
  cue: null
- prompt: Nachdem die Wissenschaftler jahrelang an dem Projekt geforscht
    ___, veröffentlichten sie ihre Ergebnisse in einer renommierten
    Fachzeitschrift.
  accepted_answers:
  - hatten
  difficulty: 3
  cue: null
