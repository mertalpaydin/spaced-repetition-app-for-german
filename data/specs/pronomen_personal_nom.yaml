topic_id: pronomen_personal_nom
cefr: A1
target_form: Personal pronouns acting as subject in the Nominative case (ich, du,
  er, sie, es, wir, ihr, sie, Sie).
item_types:
- cloze_free
- cloze_cued
- error_correction
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: ___ kommt jeden Tag zu spät.
  accepted_answers:
  - Er
  - Sie
  - Es
  difficulty: 1
  cue: null
- prompt: Weil das Wetter schön ist, gehen ___ heute spazieren.
  accepted_answers:
  - wir
  - sie
  difficulty: 2
  cue: null
- prompt: Obwohl die Kinder müde waren, sangen ___ noch ein Lied vor dem Schlafen.
  accepted_answers:
  - sie
  difficulty: 3
  cue: null
