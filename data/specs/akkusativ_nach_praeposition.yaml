topic_id: akkusativ_nach_praeposition
cefr: A2
target_form: Two-way prepositions governing Accusative when expressing direction or
  movement towards a goal (answers 'Wohin?').
item_types:
- cloze_free
- cloze_cued
max_tokens_per_sentence: 18
vocabulary_ceiling: A2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich lege das Buch auf ___ Tisch.
  accepted_answers:
  - den
  - einen
  difficulty: 1
  cue: null
- prompt: Weil die Show bald beginnt, läuft er schnell in ___ Gebäude.
  accepted_answers:
  - das
  difficulty: 2
  cue: null
- prompt: Obwohl der Weg steil war, stellte der Wanderer seinen Rucksack vorsichtig neben
    ___ Felsen.
  accepted_answers:
  - einen
  difficulty: 3
  cue: null
