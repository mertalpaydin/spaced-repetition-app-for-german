topic_id: nebensatz_damit_um_zu
cefr: B1
target_form: 'Purpose clauses: ''um...zu'' requires identical subject in both clauses;
  ''damit'' is used for different subjects (or identical).'
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Die ___ gibt dem Kind Geld, damit es sich ein Eis kauft. (Subjekte verschieden)
  accepted_answers:
  - Mutter
  difficulty: 1
  cue: null
- prompt: Das ___ spart Geld, um sich ein Eis zu kaufen. (Subjekt gleich)
  accepted_answers:
  - Kind
  difficulty: 1
  cue: null
- prompt: Hier steht Beispielsatz Nummer 3 mit ___ Lücke.
  accepted_answers:
  - einer
  difficulty: 1
  cue: null
