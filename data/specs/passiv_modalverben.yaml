topic_id: passiv_modalverben
cefr: B1
target_form: 'Passive with modal verbs: Modalverb on pos 2 + Partizip II + werden
  (Infinitiv) at sentence end.'
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Die Rechnung ___ bis Freitag bezahlt werden.
  accepted_answers:
  - muss
  difficulty: 1
  cue: null
- prompt: Ihr ___ rechtzeitig informiert werden, bevor die Versammlung
    beginnt.
  accepted_answers:
  - müsst
  difficulty: 2
  cue: null
- prompt: Die Verträge ___ vor der Unterschrift sorgfältig geprüft werden,
    obwohl die Frist bereits stark unter Druck steht.
  accepted_answers:
  - müssen
  difficulty: 3
  cue: null
