topic_id: artikel_possessiv_nom
cefr: A1
target_form: Possessive determiners in the Nominative case (mein, dein, sein, ihr,
  unser, euer, ihr, Ihr).
item_types:
- paragraph_cloze
- error_correction
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich habe ein neues Auto gekauft. ___ Auto ist blau.
  accepted_answers:
  - Mein
  difficulty: 1
  cue: null
- prompt: Frau Schmidt ist letzte Woche umgezogen. Weil sie umgezogen ist, gehört
    ___ Wohnung jetzt niemandem mehr.
  accepted_answers:
  - ihre
  difficulty: 2
  cue: null
- prompt: Er ist selten zu Hause. Obwohl er selten zu Hause ist, kostet ___ Garten
    trotzdem viel Pflege.
  accepted_answers:
  - sein
  difficulty: 3
  cue: null
