topic_id: artikel_unbestimmt_kein_nom
cefr: A1
target_form: Indefinite (ein, eine) and negative (kein, keine) articles in Nominative.
item_types:
- paragraph_cloze
- error_correction
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Im Hof ist es plötzlich laut. ___ Hund bellt laut im Hof.
  accepted_answers:
  - Ein
  - Kein
  difficulty: 1
  cue: null
- prompt: Das Zimmer wurde komplett ausgeräumt. Weil das Zimmer jetzt leer ist, steht
    dort ___ Bett.
  accepted_answers:
  - kein
  difficulty: 2
  cue: null
- prompt: Wir betraten den neuen Laden zum ersten Mal. Obwohl der Laden so groß aussieht,
    steht dort drin nur ___ Lampe.
  accepted_answers:
  - eine
  difficulty: 3
  cue: null
