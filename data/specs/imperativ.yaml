  difficulty: 1
  cue: null
- prompt: Macht ___ Bücher auf!
  accepted_answers:
  - die
  difficulty: 1
  cue: null
- prompt: Hier steht Beispielsatz Nummer 3 mit ___ Lücke.
  accepted_answers:
  - einer
  difficulty: 1
  cue: null
