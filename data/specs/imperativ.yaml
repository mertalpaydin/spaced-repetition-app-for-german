topic_id: imperativ
cefr: A1
target_form: Imperative forms for informal singular (du), informal plural (ihr), and
  formal (Sie).
item_types:
- cloze_cued
- transformation
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: ___ bitte einen Moment!
  accepted_answers:
  - Warte
  difficulty: 1
  cue: warten
- prompt: Kinder, ___ bitte auf eure Mutter!
  accepted_answers:
  - wartet
  difficulty: 2
  cue: warten
- prompt: Bevor der Zug abfährt, ___ Sie bitte noch kurz am Bahnsteig!
  accepted_answers:
  - warten
  difficulty: 3
  cue: warten
