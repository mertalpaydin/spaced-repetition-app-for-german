topic_id: praeteritum_vollverben
cefr: B1
target_form: 'Simple past of full lexical verbs (weak: -te, -test, -te...; strong:
  ablaut vowel change + -, -st, -, -en, -t, -en).'
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Sie ___ gestern Abend ein Buch.
  accepted_answers:
  - kaufte
  difficulty: 1
  cue: null
- prompt: Du ___ gestern spät nach Hause, weil die Bahn Verspätung hatte.
  accepted_answers:
  - kamst
  difficulty: 2
  cue: null
- prompt: Die Ingenieure ___ das Problem erst nach mehreren Wochen intensiver
    Forschung, obwohl sie zunächst skeptisch gewesen waren.
  accepted_answers:
  - lösten
  difficulty: 3
  cue: null
