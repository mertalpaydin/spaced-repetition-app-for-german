topic_id: nomen_plural
cefr: A1
target_form: Plural formation patterns of German nouns (-e, -(e)n, -er, -s, Umlaut).
item_types:
- cloze_cued
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: ein Tisch -> viele ___
  accepted_answers:
  - Tische
  difficulty: 1
  cue: Tisch
- prompt: Sie hat nur eine Katze, aber ihre Nachbarn haben viele ___.
  accepted_answers:
  - Katzen
  difficulty: 2
  cue: Katze
- prompt: Obwohl jedes Kind ein Buch hat, liegen am Ende viele ___ auf dem Boden.
  accepted_answers:
  - Bücher
  difficulty: 3
  cue: Buch
