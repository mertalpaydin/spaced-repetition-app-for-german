topic_id: nebensatz_temporal_erweitert
cefr: B1
target_form: Temporal subclauses expressing simultaneity (während, solange), anteriority
  (nachdem), posteriority (bevor, ehe), and boundary (seitdem, bis).
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Bevor ___ essen, waschen wir die Hände.
  accepted_answers:
  - wir
  difficulty: 1
  cue: null
- prompt: Seitdem ___ in Wien wohnt, spricht sie fließend Deutsch.
  accepted_answers:
  - sie
  difficulty: 1
  cue: null
- prompt: Hier steht Beispielsatz Nummer 3 mit ___ Lücke.
  accepted_answers:
  - einer
  difficulty: 1
  cue: null
