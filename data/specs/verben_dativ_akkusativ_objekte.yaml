topic_id: verben_dativ_akkusativ_objekte
cefr: A2
target_form: 'Word order of double objects: Nouns = Dative before Accusative; Pronouns
  = Accusative pronoun before Dative pronoun.'
item_types:
- transformation
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: A2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Die Tochter wünscht sich schon lange eine Puppe. Die Mutter kauft ___ eine
    Puppe.
  accepted_answers:
  - der Tochter
  difficulty: 1
  cue: null
- prompt: Mein Bruder hat ein neues Spiel gekauft und will es seinem Freund zeigen.
    Ich weiß, dass er ___ heute Abend zeigt.
  accepted_answers:
  - es ihm
  difficulty: 2
  cue: null
- prompt: Der Klient wartet seit Tagen auf wichtige Unterlagen. Der Anwalt, der den
    Auftrag übernommen hat, überreicht ___ die Unterlagen.
  accepted_answers:
  - dem Klienten
  difficulty: 3
  cue: null
