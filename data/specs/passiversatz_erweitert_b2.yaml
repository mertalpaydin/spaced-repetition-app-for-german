topic_id: passiversatz_erweitert_b2
cefr: B2
target_form: 'Advanced passive substitutes: ''sich lassen + Infinitiv'' and gerundive
  attributes (''zu + Partizip I'' = muss getan werden).'
item_types:
- transformation
- error_correction
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Die Tür klemmt normalerweise ein wenig. Diese Tür ___ leicht öffnen.
  accepted_answers:
  - lässt sich
  difficulty: 1
  cue: null
- prompt: Die Abteilung muss die Unterlagen bis Freitag einreichen. Die ___ Unterlagen
    liegen bereits auf dem Schreibtisch.
  accepted_answers:
  - einzureichenden
  difficulty: 2
  cue: null
- prompt: Viele Experten haben schon versucht, eine schnelle Lösung zu finden. Das
    Problem, das seit Monaten diskutiert wird, ___ sich nur mit viel Geduld lösen.
  accepted_answers:
  - lässt
  difficulty: 3
  cue: null
