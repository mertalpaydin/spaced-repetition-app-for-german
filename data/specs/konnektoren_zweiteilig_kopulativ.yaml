topic_id: konnektoren_zweiteilig_kopulativ
cefr: B1
target_form: 'Copulative two-part connectors: ''sowohl...als auch'' (positive addition),
  ''nicht nur...sondern auch'' (emphatic), ''weder...noch'' (double negation).'
item_types:
- cloze_free
- cloze_cued
- transformation
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Sie spricht ___ Englisch als auch Französisch.
  accepted_answers:
  - sowohl
  difficulty: 1
  cue: null
- prompt: Er isst ___ Fleisch noch Fisch, weil er Vegetarier ist.
  accepted_answers:
  - weder
  difficulty: 2
  cue: null
- prompt: Die Reform, die derzeit diskutiert wird, stärkt ___ die Infrastruktur, sondern
    auch die Bildungschancen.
  accepted_answers:
  - nicht nur
  difficulty: 3
  cue: null
