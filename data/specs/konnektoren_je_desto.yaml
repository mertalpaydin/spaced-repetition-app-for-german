topic_id: konnektoren_je_desto
cefr: B1
target_form: 'Proportional connector: ''je + Komparativ'' in subclause (verb-final)
  + ''desto/umso + Komparativ'' in main clause (verb directly follows).'
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Je ___ man übt, desto besser wird man.
  accepted_answers:
  - mehr
  difficulty: 1
  cue: null
- prompt: Je ___ wir abfahren, umso schneller kommen wir an.
  accepted_answers:
  - früher
  difficulty: 1
  cue: null
- prompt: Hier steht Beispielsatz Nummer 3 mit ___ Lücke.
  accepted_answers:
  - einer
  difficulty: 1
  cue: null
