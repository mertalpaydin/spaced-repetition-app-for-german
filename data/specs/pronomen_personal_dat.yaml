topic_id: pronomen_personal_dat
cefr: A1
target_form: Personal pronouns in the Dative case (mir, dir, ihm, ihr, ihm, uns, euch,
  ihnen, Ihnen).
item_types:
- cloze_free
- cloze_cued
- error_correction
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich habe heute frei, aber das Wetter gefällt ___ überhaupt nicht.
  accepted_answers:
  - mir
  difficulty: 1
  cue: null
- prompt: Weil du so nett bist, vertraue ich ___ vollkommen.
  accepted_answers:
  - dir
  difficulty: 2
  cue: null
- prompt: Obwohl die Großmutter selten Besuch bekommt, schenkte der Enkel ___ gestern frische
    Blumen.
  accepted_answers:
  - ihr
  difficulty: 3
  cue: null
