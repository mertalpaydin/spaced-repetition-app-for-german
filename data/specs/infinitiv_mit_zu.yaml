topic_id: infinitiv_mit_zu
cefr: A2
target_form: 'Infinitive clauses with ''zu'': placed before final verb (or infixed
  in separable verbs: ''aufzustehen'').'
item_types:
- cloze_free
- cloze_cued
- transformation
max_tokens_per_sentence: 18
vocabulary_ceiling: A2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich habe vor, heute Abend ___.
  accepted_answers:
  - zu kochen
  difficulty: 1
  cue: null
- prompt: Es ist wichtig, früh ___.
  accepted_answers:
  - aufzustehen
  difficulty: 2
  cue: null
- prompt: Der Praktikant, der seit einem Monat hier arbeitet, hat keine Lust, die
    Statistik noch einmal ___.
  accepted_answers:
  - durchzuarbeiten
  difficulty: 3
  cue: null
