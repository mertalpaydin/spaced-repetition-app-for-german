topic_id: konjunktiv_i_ersatzformen
cefr: B2
target_form: 'Replacement hierarchy in reported speech: when Konjunktiv I is identical
  to Indikativ, replace with Konjunktiv II or ''würde + Inf''.'
item_types:
- paragraph_cloze
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Die Zeugen haben den Täter am Tatort gesehen. Sie erklären vor
    Gericht, sie ___ den Täter am Tatort gesehen.
  accepted_answers:
  - hätten
  difficulty: 1
  cue: null
- prompt: Ich hatte meinem Chef vor Wochen versprochen, dass ich das
    Projekt pünktlich abliefere. Ich erinnerte ihn daran, ich ___ das
    Projekt termingerecht abschließen.
  accepted_answers:
  - würde
  difficulty: 2
  cue: null
- prompt: Die Anwälte hatten im Vorfeld signalisiert, dass eine
    Fertigstellung bis Ende des Monats realistisch sei. Nun betonen sie
    erneut, sie ___ trotz der zusätzlichen Beweismittel, die kurzfristig
    aufgetaucht waren, an diesem Zeitplan festhalten.
  accepted_answers:
  - könnten
  difficulty: 3
  cue: null
