  - Zeugen
  difficulty: 1
  cue: null
- prompt: Sie ___ sie würden morgen abreisen.
  accepted_answers:
  - sagten
  difficulty: 1
  cue: null
- prompt: Hier steht Beispielsatz Nummer 3 mit ___ Lücke.
  accepted_answers:
