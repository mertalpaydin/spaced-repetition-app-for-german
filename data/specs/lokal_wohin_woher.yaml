topic_id: lokal_wohin_woher
cefr: A2
target_form: 'Directional prepositions: nach (cities/countries without article), in
  (places/countries with article), zu (persons/specific destinations), aus/von (origin).'
item_types:
- cloze_free
- cloze_cued
max_tokens_per_sentence: 18
vocabulary_ceiling: A2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich fahre morgen ___ Berlin.
  accepted_answers:
  - nach
  difficulty: 1
  cue: null
- prompt: Sie geht heute ___ ihrer Ärztin, weil sie Kopfschmerzen hat.
  accepted_answers:
  - zu
  difficulty: 2
  cue: null
- prompt: Der Zug, der gerade eingefahren ist, kommt ___ der Schweiz.
  accepted_answers:
  - aus
  difficulty: 3
  cue: null
