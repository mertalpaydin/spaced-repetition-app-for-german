topic_id: zustandspassiv_zeiten
cefr: B2
target_form: 'Stative passive across tenses: war + Partizip II (Präteritum), ist +
  Partizip II + gewesen (Perfekt).'
item_types:
- cloze_free
- cloze_cued
- transformation
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Die Ausstellung ___ bereits eröffnet gewesen.
  accepted_answers:
  - ist
  difficulty: 1
  cue: null
- prompt: Du ___ damals noch nicht verheiratet, als wir uns kennenlernten.
  accepted_answers:
  - warst
  difficulty: 2
  cue: null
- prompt: Die Fenster ___ schon seit Tagen weit geöffnet, bevor der Sturm
    am Wochenende einsetzte.
  accepted_answers:
  - waren
  difficulty: 3
  cue: null
