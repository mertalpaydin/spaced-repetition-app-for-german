topic_id: verb_praesens_regelm
cefr: A1
target_form: Regular weak verb conjugation in present tense (-e, -st, -t, -en, -t,
  -en).
item_types:
- cloze_cued
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich ___ in einem kleinen Dorf.
  accepted_answers:
  - wohne
  difficulty: 1
  cue: wohnen
- prompt: Wenn die Sonne scheint, ___ die Kinder gern im Garten.
  accepted_answers:
  - spielen
  difficulty: 2
  cue: spielen
- prompt: Obwohl der Bus oft zu spät kommt, ___ meine Kollegin jeden Morgen geduldig
    an der Haltestelle.
  accepted_answers:
  - wartet
  difficulty: 3
  cue: warten
