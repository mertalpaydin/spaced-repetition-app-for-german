topic_id: futur_ii
cefr: B2
target_form: 'Future II: werden (pos 2) + Partizip II + haben/sein (Infinitiv) at
  end; expresses completed action in future or past assumption.'
item_types:
- cloze_free
- cloze_cued
- transformation
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich ___ das Buch bis nächste Woche gelesen haben.
  accepted_answers:
  - werde
  difficulty: 1
  cue: null
- prompt: Du ___ die Prüfung sicher bestanden haben, wenn du weiter so
    fleißig lernst.
  accepted_answers:
  - wirst
  difficulty: 2
  cue: null
- prompt: Die Handwerker ___ das Haus bis zum Winter vollständig renoviert
    haben, obwohl der Zeitplan von Anfang an sehr knapp war.
  accepted_answers:
  - werden
  difficulty: 3
  cue: null
