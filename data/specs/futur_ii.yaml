topic_id: futur_ii
cefr: B2
target_form: 'Future II: werden (pos 2) + Partizip II + haben/sein (Infinitiv) at
  end; expresses completed action in future or past assumption.'
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Er ___ nicht; er wird wohl schon eingeschlafen sein. (Vermutung über Vergangenheit)
  accepted_answers:
  - antwortet
  difficulty: 1
  cue: null
- prompt: Bis ___ des Jahres werde ich die B2-Prüfung bestanden haben. (Zukunft)
  accepted_answers:
  - Ende
  difficulty: 1
  cue: null
- prompt: Hier steht Beispielsatz Nummer 3 mit ___ Lücke.
  accepted_answers:
  - einer
  difficulty: 1
  cue: null
