topic_id: temporal_praepositionen
cefr: A2
target_form: Time prepositions governing Dative/Accusative (um + Uhrzeit, am + Tag,
  im + Monat/Jahreszeit, seit/vor + Dativ, bis + Akkusativ).
item_types:
- cloze_free
- cloze_cued
max_tokens_per_sentence: 18
vocabulary_ceiling: A2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Der Unterricht beginnt ___ 8 Uhr.
  accepted_answers:
  - um
  difficulty: 1
  cue: null
- prompt: Er arbeitet ___ zwei Jahren als Lehrer, weil ihm der Beruf gefällt.
  accepted_answers:
  - seit
  difficulty: 2
  cue: null
- prompt: Das Projekt, das wir im Januar gestartet haben, muss ___ Ende des Monats
    fertig sein.
  accepted_answers:
  - bis
  difficulty: 3
  cue: null
