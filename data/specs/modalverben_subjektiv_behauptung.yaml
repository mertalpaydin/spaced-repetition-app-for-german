topic_id: modalverben_subjektiv_behauptung
cefr: B2
target_form: 'Modal verbs expressing reported claims: ''soll'' (rumour/others claim)
  vs ''will'' (the subject claims about themselves).'
item_types:
- paragraph_cloze
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Man erzählt sich viele Geschichten über den neuen Kollegen. Der neue Mitarbeiter
    ___ früher Profisportler gewesen sein.
  accepted_answers:
  - soll
  difficulty: 1
  cue: null
- prompt: Sie ___ die ganze Aufgabe allein gelöst haben, das behauptet sie zumindest
    selbst.
  accepted_answers:
  - will
  difficulty: 2
  cue: null
- prompt: Der Zeuge, der die Szene angeblich beobachtet hat, ___ den Täter genau erkannt
    haben.
  accepted_answers:
  - will
  difficulty: 3
  cue: null
