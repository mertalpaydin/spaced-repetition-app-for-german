topic_id: adjektivdeklination_nullartikel
cefr: A2
target_form: 'Strong adjective endings with zero article: adjective carries definite
  article endings (-er, -e, -es, -en, -em, etc.).'
item_types:
- cloze_free
- cloze_cued
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: A2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: ___ Kaffee schmeckt sehr gut.
  accepted_answers:
  - Heißer
  difficulty: 1
  cue: null
- prompt: Weil sie ___ Wasser trinkt, fühlt sie sich fit.
  accepted_answers:
  - kaltes
  difficulty: 2
  cue: null
- prompt: Menschen, die viel reisen, schätzen ___ Erfahrungen im Ausland.
  accepted_answers:
  - wertvolle
  difficulty: 3
  cue: null
