topic_id: futur_i
cefr: B1
target_form: 'Future I: werden (conjugated pos 2) + Infinitiv at sentence end; expresses
  future intentions or present assumptions.'
item_types:
- cloze_free
- cloze_cued
- transformation
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich ___ nächstes Jahr nach Spanien reisen.
  accepted_answers:
  - werde
  difficulty: 1
  cue: null
- prompt: Du ___ die Prüfung sicher bestehen, wenn du weiter so fleißig
    lernst.
  accepted_answers:
  - wirst
  difficulty: 2
  cue: null
- prompt: Die Teilnehmer ___ ihre Ergebnisse erst nächste Woche erfahren,
    obwohl die Auswertung schon länger abgeschlossen ist.
  accepted_answers:
  - werden
  difficulty: 3
  cue: null
