topic_id: artikel_bestimmt_nom
cefr: A1
target_form: Definite articles in the Nominative case (der, die, das, die).
item_types:
- paragraph_cloze
- error_correction
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Wir haben einen Tisch bekommen. ___ Tisch ist neu.
  accepted_answers:
  - Der
  difficulty: 1
  cue: null
- prompt: Die Familie hat ein Kind. Weil es regnet, bleibt ___ Kind heute zu Hause.
  accepted_answers:
  - das
  difficulty: 2
  cue: null
- prompt: Am Markt gibt es einen Laden, den viele Leute mögen. Obwohl es spät war,
    blieb ___ Laden noch eine Stunde geöffnet.
  accepted_answers:
  - der
  difficulty: 3
  cue: null
