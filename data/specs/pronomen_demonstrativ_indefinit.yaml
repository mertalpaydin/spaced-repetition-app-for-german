topic_id: pronomen_demonstrativ_indefinit
cefr: A2
target_form: Demonstrative determiners (dieser/diese/dieses) and indefinite pronouns
  (jeder, alle, man, jemand, niemand).
item_types:
- cloze_free
- cloze_cued
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: A2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: ___ Mantel gefällt mir sehr gut.
  accepted_answers:
  - Dieser
  difficulty: 1
  cue: null
- prompt: In diesem Land spricht ___ meistens zwei Sprachen, weil die Grenzregion
    mehrsprachig ist.
  accepted_answers:
  - man
  difficulty: 2
  cue: null
- prompt: Bei dieser Prüfung, die sehr anspruchsvoll ist, darf ___ ein Wörterbuch
    benutzen.
  accepted_answers:
  - niemand
  difficulty: 3
  cue: null
