topic_id: funktionsverbgefuege
cefr: B2
target_form: Fixed noun-verb collocations (FVG) in formal register (zur Verfügung
  stehen, in Frage kommen, eine Entscheidung treffen).
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Der Konferenzraum steht ab morgen zur ___.
  accepted_answers:
  - Verfügung
  difficulty: 1
  cue: null
- prompt: Diese Lösung kommt für uns nicht in ___, weil sie zu teuer ist.
  accepted_answers:
  - Frage
  difficulty: 2
  cue: null
- prompt: Der Ausschuss, der seit Wochen über das Budget berät, muss endlich eine
    Entscheidung ___.
  accepted_answers:
  - treffen
  difficulty: 3
  cue: null
