  - Minister
  difficulty: 1
  cue: null
- prompt: Sie ___ sie sei mit dem Ergebnis zufrieden.
  accepted_answers:
  - sagte
  difficulty: 1
  cue: null
- prompt: Hier steht Beispielsatz Nummer 3 mit ___ Lücke.
  accepted_answers:
  - einer
  difficulty: 1
  cue: null
