topic_id: konjunktiv_i_indirekte_rede
cefr: B2
target_form: Subjunctive I for indirect reporting in journalism and formal registers;
  distinct forms derived from present stem.
item_types:
- paragraph_cloze
- error_correction
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Die Kollegin hat dem Team eine wichtige Nachricht zukommen lassen.
    Sie erklärt, sie ___ heute keine Zeit für das Meeting.
  accepted_answers:
  - habe
  difficulty: 1
  cue: null
- prompt: Die Ärzte haben sich nach der Untersuchung beraten. Sie erklären,
    sie ___ mit dem Ergebnis zufrieden, auch wenn noch letzte Tests
    ausstehen.
  accepted_answers:
  - seien
  difficulty: 2
  cue: null
- prompt: Das Forschungsteam hat monatelang an einem neuen Verfahren
    gearbeitet. Die Wissenschaftlerin betont, die Methode ___ deutlich
    genauere Messwerte liefern als alle bisherigen Verfahren, die zuvor
    eingesetzt wurden.
  accepted_answers:
  - könne
  difficulty: 3
  cue: null
