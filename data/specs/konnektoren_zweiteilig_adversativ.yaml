topic_id: konnektoren_zweiteilig_adversativ
cefr: B1
target_form: 'Alternative and adversative two-part connectors: ''entweder...oder''
  (exclusive or), ''zwar...aber'' (concession), ''einerseits...andererseits''.'
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Wir fahren ___ nach Spanien oder nach Portugal.
  accepted_answers:
  - entweder
  difficulty: 1
  cue: null
- prompt: Das Hotel ist ___ teuer, aber der Service ist hervorragend.
  accepted_answers:
  - zwar
  difficulty: 2
  cue: null
- prompt: Die Studie, die von der Universität durchgeführt wurde, zeigt ___ positive
    Effekte, andererseits auch erhebliche Risiken.
  accepted_answers:
  - einerseits
  difficulty: 3
  cue: null
