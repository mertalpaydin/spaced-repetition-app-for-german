topic_id: nominalstil_verbalstil
cefr: B2
target_form: Transformation between verbal clauses (Nebensätze mit Konjunktionen)
  and nominal structures (Präpositionalgefüge mit Genitiv/Dativ).
item_types:
- paragraph_cloze
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Der Chef hat den Termin abgesagt, weil er krank wurde. ___ seiner Krankheit
    musste der Termin verschoben werden.
  accepted_answers:
  - Wegen
  difficulty: 1
  cue: null
- prompt: Die Firma investierte viel Geld, um die Produktion zu modernisieren. ___
    der Investitionen stieg die Produktivität deutlich.
  accepted_answers:
  - Dank
  difficulty: 2
  cue: null
- prompt: Die Regierung hat neue Gesetze erlassen, nachdem es zu schweren Unruhen
    gekommen war. ___ den schweren Unruhen erließ die Regierung neue Gesetze.
  accepted_answers:
  - Nach
  difficulty: 3
  cue: null
