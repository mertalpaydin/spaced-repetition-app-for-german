topic_id: verb_sein_haben
cefr: A1
target_form: Present tense conjugations of auxiliary/copula verbs 'sein' and 'haben'.
item_types:
- cloze_cued
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich ___ heute sehr müde.
  accepted_answers:
  - bin
  difficulty: 1
  cue: sein
- prompt: Weil ihr eine große Familie ___, braucht ihr ein großes Auto.
  accepted_answers:
  - habt
  difficulty: 2
  cue: haben
- prompt: Obwohl die Nachbarn oft laut streiten, ___ mein Bruder große Geduld mit
    ihnen.
  accepted_answers:
  - hat
  difficulty: 3
  cue: haben
