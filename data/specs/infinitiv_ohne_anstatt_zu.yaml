topic_id: infinitiv_ohne_anstatt_zu
cefr: B2
target_form: Modal infinitive clauses expressing absence ('ohne...zu') or substitution
  ('anstatt...zu') with identical subject.
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Er ___ an mir vorbei, ohne mich zu grüßen.
  accepted_answers:
  - ging
  difficulty: 1
  cue: null
- prompt: Anstatt ___ zu entschuldigen, lachte er nur.
  accepted_answers:
  - sich
  difficulty: 1
  cue: null
- prompt: Hier steht Beispielsatz Nummer 3 mit ___ Lücke.
  accepted_answers:
  - einer
  difficulty: 1
  cue: null
