topic_id: kasus_genitiv_formen
cefr: B1
target_form: 'Genitive case: des ...-(e)s (m/n), der (f/pl), and masculine weak nouns
  (n-Deklination: des Kunden, des Studenten).'
item_types:
- cloze_free
- cloze_cued
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Das ist das Auto ___ Chefs.
  accepted_answers:
  - des
  difficulty: 1
  cue: null
- prompt: Wir bewundern die Fassade ___ historischen Rathauses, das gerade
    renoviert wird.
  accepted_answers:
  - des
  difficulty: 2
  cue: null
- prompt: Das Büro ___ neuen Studenten liegt im zweiten Stock, gleich neben
    der Bibliothek.
  accepted_answers:
  - des
  difficulty: 3
  cue: null
