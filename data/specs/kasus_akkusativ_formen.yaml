topic_id: kasus_akkusativ_formen
cefr: A1
target_form: 'Accusative articles for direct objects: only masculine changes (den,
  einen, keinen), others remain.'
item_types:
- cloze_free
- cloze_cued
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich sehe ___ Mann dort drüben.
  accepted_answers:
  - den
  difficulty: 1
  cue: null
- prompt: Weil sie Hunger hat, isst sie ___ Brötchen zum Frühstück.
  accepted_answers:
  - das
  - ein
  difficulty: 2
  cue: null
- prompt: Obwohl der Film sehr lang war, fand das Publikum ___ Schauspieler brillant.
  accepted_answers:
  - den
  - einen
  difficulty: 3
  cue: null
