topic_id: nebensatz_sodass_deshalb
cefr: B1
target_form: 'Consecutive connection: ''sodass / so...dass'' (subclause, verb at end)
  vs ''deshalb / deswegen'' (adverbial on pos 1, verb on pos 2).'
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: B1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Er war sehr müde, ___ er sofort einschlief.
  accepted_answers:
  - sodass
  difficulty: 1
  cue: null
- prompt: Die Straße war gesperrt; ___ mussten wir einen Umweg fahren.
  accepted_answers:
  - deshalb
  difficulty: 2
  cue: null
- prompt: Die Verhandlungen, die seit Tagen liefen, gerieten so sehr ins Stocken,
    ___ beide Seiten den Termin verschoben.
  accepted_answers:
  - dass
  difficulty: 3
  cue: null
