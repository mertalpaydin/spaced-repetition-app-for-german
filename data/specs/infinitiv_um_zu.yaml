topic_id: infinitiv_um_zu
cefr: A2
target_form: Purpose clause 'um...zu' + infinitive when subjects of main and subclause
  are identical.
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 18
vocabulary_ceiling: A2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Er lernt jeden Tag, um die Prüfung ___.
  accepted_answers:
  - zu bestehen
  difficulty: 1
  cue: null
- prompt: Wir sparen Geld, um uns ein neues Auto ___.
  accepted_answers:
  - zu kaufen
  difficulty: 2
  cue: null
- prompt: Die Firma investiert in Schulungen, um die Mitarbeiter, die noch unerfahren
    sind, besser ___.
  accepted_answers:
  - vorzubereiten
  difficulty: 3
  cue: null
