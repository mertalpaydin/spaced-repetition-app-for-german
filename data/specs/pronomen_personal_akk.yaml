topic_id: pronomen_personal_akk
cefr: A1
target_form: Personal pronouns in the Accusative case (mich, dich, ihn, sie, es, uns,
  euch, sie, Sie).
item_types:
- cloze_free
- cloze_cued
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich sehe ___ jeden Tag in der Schule.
  accepted_answers:
  - ihn
  - sie
  - es
  difficulty: 1
  cue: null
- prompt: Weil ich im Regen stehe, holt mein Vater ___ vom Bahnhof ab.
  accepted_answers:
  - mich
  difficulty: 2
  cue: null
- prompt: Obwohl sie mich kaum kennt, lud sie ___ spontan zu ihrer Feier ein.
  accepted_answers:
  - dich
  difficulty: 3
  cue: null
