topic_id: modalpartikeln
cefr: B2
target_form: Abtönungspartikeln that color tone and attitude in conversation (ja =
  as you know, doch = urging/contradiction, denn = curiosity).
item_types:
- paragraph_cloze
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Peter zögert immer noch, ins kalte Wasser zu springen. Spring ___ endlich
    rein, das Wasser ist warm!
  accepted_answers:
  - doch
  difficulty: 1
  cue: null
- prompt: Mein Nachbar hat heute ungewöhnlich viele Pakete bekommen. Was macht er
    ___ mit so vielen Paketen?
  accepted_answers:
  - denn
  difficulty: 2
  cue: null
- prompt: Die Nachbarn haben sich schon oft über den Lärm beschwert, den die Baustelle
    nebenan verursacht. Die Bauarbeiten sind ___ eine große Belastung für alle Anwohner.
  accepted_answers:
  - ja
  difficulty: 3
  cue: null
