topic_id: praepositionen_dativ
cefr: A1
target_form: 'Prepositions that strictly govern Dative: aus, bei, mit, nach, seit,
  von, zu, gegenüber.'
item_types:
- cloze_free
- cloze_cued
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Sie kommt aus ___ Türkei.
  accepted_answers:
  - der
  difficulty: 1
  cue: null
- prompt: Weil sie neu in der Stadt ist, wohnt sie bei ___ Freundin.
  accepted_answers:
  - einer
  difficulty: 2
  cue: null
- prompt: Obwohl das Semester stressig war, fahren viele Studierende direkt nach ___ Prüfungen
    in die Ferien.
  accepted_answers:
  - den
  difficulty: 3
  cue: null
