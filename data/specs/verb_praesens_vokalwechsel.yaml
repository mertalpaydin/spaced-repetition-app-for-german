topic_id: verb_praesens_vokalwechsel
cefr: A1
target_form: Strong verbs with stem vowel change in 2nd and 3rd person singular (e->i/ie,
  a->ä, au->äu).
item_types:
- cloze_free
- cloze_cued
- error_correction
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Du ___ sehr gern Comics.
  accepted_answers:
  - liest
  difficulty: 1
  cue: null
- prompt: Wenn du Hunger hast, ___ du am besten sofort etwas.
  accepted_answers:
  - isst
  difficulty: 2
  cue: null
- prompt: Obwohl ihre Kollegen häufig Überstunden machen, ___ meine Nachbarn abends meist
    entspannt zu Abend.
  accepted_answers:
  - essen
  difficulty: 3
  cue: null
