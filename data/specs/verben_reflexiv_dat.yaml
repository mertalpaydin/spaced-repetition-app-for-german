topic_id: verben_reflexiv_dat
cefr: A2
target_form: Reflexive verbs with Dative reflexive pronouns when an explicit Accusative
  object is present (mir, dir, sich...).
item_types:
- cloze_free
- cloze_cued
max_tokens_per_sentence: 18
vocabulary_ceiling: A2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich putze ___ jeden Abend die Zähne.
  accepted_answers:
  - mir
  difficulty: 1
  cue: null
- prompt: Wenn ihr nach Hause kommt, wascht ___ bitte gründlich die Hände.
  accepted_answers:
  - euch
  difficulty: 2
  cue: null
- prompt: Obwohl die Zeit knapp war, kämmte ___ die Studentin vor dem Gespräch noch schnell
    die Haare.
  accepted_answers:
  - sich
  difficulty: 3
  cue: null
