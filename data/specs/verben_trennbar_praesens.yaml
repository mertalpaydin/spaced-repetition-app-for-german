topic_id: verben_trennbar_praesens
cefr: A1
target_form: 'Separable verbs: prefix separates and moves to the end of main clause
  in present tense.'
item_types:
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Ich ___ jeden Tag früh auf.
  accepted_answers:
  - stehe
  difficulty: 1
  cue: aufstehen
- prompt: Wenn du mich brauchst, ___ du mich einfach an.
  accepted_answers:
  - rufst
  difficulty: 2
  cue: anrufen
- prompt: Obwohl die Preise gestiegen sind, ___ viele Familien samstags günstig im
    Supermarkt ein.
  accepted_answers:
  - kaufen
  difficulty: 3
  cue: einkaufen
