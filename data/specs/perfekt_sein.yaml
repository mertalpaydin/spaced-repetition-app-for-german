topic_id: perfekt_sein
cefr: A1
target_form: Past compound tense (Perfekt) formed with auxiliary 'sein' (movement,
  change of state, sein/bleiben).
item_types:
- cloze_free
- cloze_cued
- transformation
- error_correction
max_tokens_per_sentence: 14
vocabulary_ceiling: A1
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Wir ___ nach Hause gegangen.
  accepted_answers:
  - sind
  difficulty: 1
  cue: null
- prompt: Weil der Zug Verspätung hatte, ___ ich zu spät angekommen.
  accepted_answers:
  - bin
  difficulty: 2
  cue: null
- prompt: Obwohl ihr euch beeilt habt, ___ ihr trotzdem zu spät zur Vorstellung gekommen.
  accepted_answers:
  - seid
  difficulty: 3
  cue: null
