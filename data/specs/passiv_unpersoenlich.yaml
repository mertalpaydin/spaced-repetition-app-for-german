topic_id: passiv_unpersoenlich
cefr: B2
target_form: 'Impersonal passive of intransitive verbs without subject: ''Es wird
  getanzt'' / ''Hier wird gearbeitet''.'
item_types:
- cloze_free
- transformation
max_tokens_per_sentence: 24
vocabulary_ceiling: B2
difficulty_tiers:
  1: Simple single clause, high-frequency vocabulary, concrete context.
  2: One subordinate or coordinate clause, mid-frequency vocabulary.
  3: Nested clauses, distractors present in context, low-frequency vocabulary.
forbidden:
- any grammatical terminology in the prompt
- any instruction naming case, tense, or mood
- the answer appearing elsewhere in the sentence
- unnatural or convoluted German phrasing
gold_examples:
- prompt: Auf der Party ___ bis spät in die Nacht getanzt.
  accepted_answers:
  - wurde
  difficulty: 1
  cue: null
- prompt: In der Fabrik ___ früher sechs Tage die Woche gearbeitet, bis die
    neuen Arbeitszeitregeln eingeführt wurden.
  accepted_answers:
  - wurde
  difficulty: 2
  cue: null
- prompt: In diesem Kloster ___ jahrhundertelang in vollkommener Stille
    gearbeitet, gebetet und gelesen, obwohl das strenge Regelwerk
    mittlerweile gelockert worden ist.
  accepted_answers:
  - wurde
  difficulty: 3
  cue: null
