# Connectors are matched against this list, never mined. One entry per unit.
#
#   key                        unit key and id source
#   kind                       connector | two_part_connector
#   forms                      surface forms (lowercase, may be multi-word)
#   pos                        optional POS guard on the first token
#   needs_context_when_initial a sentence-initial match needs a preceding sentence
#   trivial                    known from week one; never a card by default
#   first / second             the two parts of a two_part_connector
#
# Adverbial connectors (position 0 or after the verb).
- {key: trotzdem, kind: connector, forms: [trotzdem], pos: [ADV], cefr: B1, gloss_en: nevertheless / all the same / anyway, needs_context_when_initial: true, also_accepted: [dennoch]}
- {key: dennoch, kind: connector, forms: [dennoch], pos: [ADV], cefr: B2, gloss_en: nonetheless / still / yet, needs_context_when_initial: true, also_accepted: [trotzdem]}
- {key: allerdings, kind: connector, forms: [allerdings], pos: [ADV], cefr: B1, gloss_en: however / though / admittedly, needs_context_when_initial: true, also_accepted: [jedoch]}
- {key: jedoch, kind: connector, forms: [jedoch], pos: [ADV, CCONJ], cefr: B1, gloss_en: however / but / yet, needs_context_when_initial: true, also_accepted: [allerdings]}
- {key: deshalb, kind: connector, forms: [deshalb], pos: [ADV], cefr: A2, gloss_en: therefore / that is why / so, needs_context_when_initial: true, also_accepted: [deswegen, daher, darum]}
- {key: deswegen, kind: connector, forms: [deswegen], pos: [ADV], cefr: B1, gloss_en: that is why / because of that, needs_context_when_initial: true, also_accepted: [deshalb, daher, darum]}
- {key: daher, kind: connector, forms: [daher], pos: [ADV], cefr: B1, gloss_en: hence / therefore / that is why, needs_context_when_initial: true, also_accepted: [deshalb, deswegen, darum]}
- {key: darum, kind: connector, forms: [darum], pos: [ADV], cefr: A2, gloss_en: that is why / therefore, needs_context_when_initial: true, also_accepted: [deshalb, deswegen, daher]}
- {key: also, kind: connector, forms: [also], pos: [ADV], cefr: A2, gloss_en: so / therefore / thus, needs_context_when_initial: true}
- {key: außerdem, kind: connector, forms: [außerdem], pos: [ADV], cefr: A2, gloss_en: besides / in addition / also, needs_context_when_initial: true, also_accepted: [zudem]}
- {key: zudem, kind: connector, forms: [zudem], pos: [ADV], cefr: B2, gloss_en: moreover / in addition / also, needs_context_when_initial: true, also_accepted: [außerdem]}
- {key: dagegen, kind: connector, forms: [dagegen], pos: [ADV], cefr: B1, gloss_en: on the other hand / by contrast / against it, needs_context_when_initial: true}
- {key: hingegen, kind: connector, forms: [hingegen], pos: [ADV], cefr: B2, gloss_en: whereas / by contrast / on the other hand, needs_context_when_initial: true}
