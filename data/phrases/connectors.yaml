# Two-part connectors.
- key: sowohl … als auch
  kind: two_part_connector
  first: {forms: [sowohl]}
  second: {forms: [als auch]}
  display: "sowohl … als auch"
  cefr: B1
  gloss_en: both … and
- key: nicht nur … sondern auch
  kind: two_part_connector
  first: {forms: [nicht nur]}
  second: {forms: [sondern auch]}
  display: "nicht nur … sondern auch"
  cefr: B1
  gloss_en: not only … but also
- key: weder … noch
  kind: two_part_connector
  first: {forms: [weder]}
  second: {forms: [noch]}
  display: "weder … noch"
  cefr: B1
  gloss_en: neither … nor
- key: entweder … oder
  kind: two_part_connector
  first: {forms: [entweder]}
  second: {forms: [oder]}
  display: "entweder … oder"
  cefr: A2
  gloss_en: either … or
- key: zwar … aber
  kind: two_part_connector
  first: {forms: [zwar], not_after: [und]}
  second: {forms: [aber]}
  display: "zwar … aber"
  cefr: B1
  gloss_en: admittedly … but
- key: einerseits … andererseits
  kind: two_part_connector
  first: {forms: [einerseits]}
  second: {forms: [andererseits]}
  display: "einerseits … andererseits"
  cefr: B1
  gloss_en: on the one hand … on the other
- key: je … desto
  kind: two_part_connector
  first: {forms: [je], next_must_be_comparative: true}
  second: {forms: [desto], next_must_be_comparative: true}
  display: "je … desto"
  cefr: B1
  gloss_en: the (more) … the (more)
- key: mal … mal
  kind: two_part_connector
  first: {forms: [mal], pos: [ADV]}
  second: {forms: [mal], pos: [ADV]}
  display: "mal … mal"
  cefr: B2
  gloss_en: sometimes … sometimes
