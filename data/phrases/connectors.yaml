- {key: ansonsten, kind: connector, forms: [ansonsten], pos: [ADV], cefr: B1, gloss_en: otherwise / apart from that, needs_context_when_initial: true}
- {key: nämlich, kind: connector, forms: [nämlich], pos: [ADV], cefr: B1, gloss_en: namely / you see, needs_context_when_initial: true}
