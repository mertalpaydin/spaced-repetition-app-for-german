- {key: bis, kind: connector, forms: [bis], pos: [SCONJ], cefr: A2, gloss_en: until}
- {key: dass, kind: connector, forms: [dass], pos: [SCONJ], cefr: A1, gloss_en: that, trivial: true}
- {key: weil, kind: connector, forms: [weil], pos: [SCONJ], cefr: A1, gloss_en: because, trivial: true}
- {key: wenn, kind: connector, forms: [wenn], pos: [SCONJ], cefr: A1, gloss_en: if / when, trivial: true}
