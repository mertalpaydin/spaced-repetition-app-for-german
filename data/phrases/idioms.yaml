# Fixed expressions, matched as a token sequence. Pattern elements are surface
# forms (case-insensitive) or "lemma:<lemma>"; max_gap is how many tokens may
# sit between consecutive elements. Zero-hit idioms are kept and ranked last.
- {key: es geht um, pattern: [es, "lemma:gehen", um], max_gap: 2, display: "es geht um + Akk", cefr: B1, gloss_en: it is about}
- {key: es gibt, pattern: [es, "lemma:geben"], max_gap: 0, display: "es gibt + Akk", cefr: A1, gloss_en: there is / there are}
- {key: es tut mir leid, pattern: [es, "lemma:tun", mir, leid], max_gap: 0, display: "es tut mir leid (, dass …)", cefr: A1, gloss_en: I am sorry}
- {key: es kommt darauf an, pattern: [es, "lemma:kommen", darauf, an], max_gap: 1, display: "es kommt darauf an (, ob / wie …)", cefr: B1, gloss_en: it depends}
- {key: es handelt sich um, pattern: [es, "lemma:handeln", sich, um], max_gap: 1, display: "es handelt sich um + Akk", cefr: B1, gloss_en: it is a matter of}
- {key: es lohnt sich, pattern: [es, "lemma:lohnen", sich], max_gap: 0, display: "es lohnt sich (, zu … / für + Akk)", cefr: B1, gloss_en: it is worth it}
