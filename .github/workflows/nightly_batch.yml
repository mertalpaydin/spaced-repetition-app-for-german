name: Nightly Bank Health Audit

on:
  schedule:
    # 09:00 UTC daily: one hour after generate-ingest.yml (0 8 * * *) has had a
    # chance to complete, and clear of generate-submit.yml (0 2 * * *). Sharing a
    # cron with either of those makes this job race the batch pipeline for no
    # reason; it only reads the bank, it does not touch batch state.
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  bank-health-audit:
    name: Audit Item Bank Health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync

      - name: Run Bank Health Audit
        run: |
          if [ -f data/bank.db ]; then
            uv run python -m src.audit.bank_health --db data/bank.db
          else
            echo "No data/bank.db yet (bank not populated); skipping audit."
          fi
