name: Batch Generation Ingest & Verify (08:00 UTC)

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  ingest-batch:
    name: Download Batch, Run Verification Pipeline & Append to Bank
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync

      - name: Download & Verify Items
        # Exits 0 both when nothing has been submitted yet and when the batch is
        # still pending (retried on tomorrow's schedule); non-zero only on a real
        # failure. See src.generation.batch_client.run_ingest.
        run: uv run python -m src.generation.batch_client --action ingest
        env:
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}
