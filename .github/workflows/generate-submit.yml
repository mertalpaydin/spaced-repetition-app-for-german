name: Batch Generation Submit (02:00 UTC)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write  # needed to persist data/generation_state.json for the ingest job

jobs:
  submit-batch:
    name: Identify Bank Deficits & Submit Gemini Batch Requests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync

      - name: Calculate Deficits & Submit Batch
        run: uv run python -m src.generation.batch_client --action submit
        env:
          GEMINI_FREE_API_KEY: ${{ secrets.GEMINI_FREE_API_KEY }}
          GEMINI_PAID_API_KEY: ${{ secrets.GEMINI_PAID_API_KEY }}

      - name: Persist Batch State
        # generate-ingest.yml runs as a separate workflow, hours later, on a fresh
        # checkout: the submitted batch id (and the requests needed to recover it
        # idempotently) must be committed, not just left on this runner's disk.
        run: |
          if [ -f data/generation_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/generation_state.json
            if ! git diff --cached --quiet; then
              git commit -m "chore(generation): persist submitted batch id [skip ci]"
              git push
            fi
          fi
