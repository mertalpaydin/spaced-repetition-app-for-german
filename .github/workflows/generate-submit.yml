name: Batch Generation Submit (02:00 UTC)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  submit-batch:
    name: Identify Bank Deficits & Submit Gemini Batch Requests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync

      - name: Calculate Deficits & Submit Batch
        run: uv run python -m src.generation.batch_client --action submit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
