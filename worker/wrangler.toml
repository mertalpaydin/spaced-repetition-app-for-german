name = "deutschmaster-sync"
main = "src/index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "deutschmaster_d1"
database_id = "local-d1-binding"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "production"
API_VERSION = "1.0.0"

# SYNC_TOKEN is a required shared-secret bearer token: every request except
# GET /health must send `Authorization: Bearer <SYNC_TOKEN>` or the worker
# returns 401 before touching D1 (see src/index.js isAuthenticated). It is a
# secret binding, never a plaintext var, and must never be committed here.
# Set it with:
#   wrangler secret put SYNC_TOKEN
# [secrets]
# SYNC_TOKEN = "<set via `wrangler secret put SYNC_TOKEN`, never committed>"
